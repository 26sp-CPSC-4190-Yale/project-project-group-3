<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenShelf — Search</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='frontend/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='frontend/search.css') }}">
</head>
<body>
  <div class="app-shell">
    <nav class="topnav">
      <span class="topnav-brand">open<span>shelf</span></span>
      <div class="topnav-right">
        {% if current_user.id %}
        <div class="avatar-circle">{{ (current_user.username or 'OS')[:2]|upper }}</div>
        {% else %}
        <a class="btn btn-secondary" href="{{ url_for('index') }}">Sign in</a>
        {% endif %}
      </div>
    </nav>

    <main class="page-content">
      <div class="search-header">
        <h1 class="search-title">Find textbooks</h1>
        <p class="search-sub">Search by title, author, ISBN, or course code</p>
      </div>

      <form action="{{ url_for('search.search_results') }}" method="get">
        <input type="hidden" name="field" id="field-input" value="all">
        <div class="search-bar-wrap">
          <span class="search-icon">🔍</span>
          <input
            class="search-bar"
            id="search-input"
            name="q"
            type="text"
            placeholder="e.g. Organic Chemistry or CHEM 220"
            required
          />
          <button class="search-clear hidden" id="clear-btn" type="button" onclick="clearSearch()">✕</button>
        </div>

        <div class="tag-row" id="tag-row">
          <button class="tag active-tag" type="button" onclick="quickSearch(this,'')">All</button>
          <button class="tag" type="button" onclick="quickSearch(this,'CPSC')">CPSC</button>
          <button class="tag" type="button" onclick="quickSearch(this,'MATH')">MATH</button>
          <button class="tag" type="button" onclick="quickSearch(this,'CHEM')">CHEM</button>
          <button class="tag" type="button" onclick="quickSearch(this,'ECON')">ECON</button>
          <button class="tag" type="button" onclick="quickSearch(this,'PHYS')">PHYS</button>
          <button class="tag" type="button" onclick="quickSearch(this,'ENGL')">ENGL</button>
        </div>

        <button class="btn btn-primary btn-full" type="submit">Search listings</button>
      </form>
    </main>

    <nav class="botnav">
      <a href="{{ url_for('index') }}" class="nav-btn">Home <div class="nav-dot"></div></a>
      <a href="{{ url_for('search.search_page') }}" class="nav-btn active">Search <div class="nav-dot"></div></a>
      <a href="{{ url_for('chat.chat_list') }}" class="nav-btn">Chats <div class="nav-dot"></div>{% if unread_count > 0 %}<span class="nav-badge">{{ unread_count }}</span>{% endif %}</a>
      <a href="{{ url_for('listings.profile_page') }}" class="nav-btn">Saved <div class="nav-dot"></div></a>
      <a href="{{ url_for('upload.upload_page') }}" class="nav-btn">Upload <div class="nav-dot"></div></a>
    </nav>
  </div>

  <script>
    function clearSearch() {
      const input = document.getElementById('search-input');
      input.value = '';
      input.focus();
      document.getElementById('clear-btn').classList.add('hidden');
    }

    function quickSearch(el, tag) {
      document.querySelectorAll('.tag').forEach((chip) => chip.classList.remove('active-tag'));
      el.classList.add('active-tag');
      const input = document.getElementById('search-input');
      input.value = tag;
      document.getElementById('clear-btn').classList.toggle('hidden', tag.length === 0);
      if (tag) input.form.submit();
    }

    document.getElementById('search-input').addEventListener('input', (event) => {
      document.getElementById('clear-btn').classList.toggle('hidden', event.target.value.length === 0);
    });
  </script>
</body>
</html>
