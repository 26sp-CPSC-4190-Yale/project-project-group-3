<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenShelf — Messages</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="messaging.css">
</head>
<body>
  <div class="app-shell">
 
    <nav class="topnav">
      <span class="topnav-brand">open<span>shelf</span></span>
      <div class="topnav-right">
        <div class="avatar-circle">AY</div>
      </div>
    </nav>
 
    <main class="page-content">
 
      <!-- Conversation list view -->
      <div id="list-view">
        <h1 class="msg-page-title">Messages</h1>
        <input
          class="msg-search"
          type="text"
          placeholder="Search conversations..."
          oninput="filterConvos(this.value)"
        />
        <div class="convo-list" id="convo-list"></div>
      </div>
 
      <!-- Chat view (hidden initially) -->
      <div id="chat-view" class="hidden">
        <button class="back-btn" onclick="showList()">← Back</button>
        <div class="chat-panel">
          <div class="chat-header" id="chat-header"></div>
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-input-row">
            <input
              class="chat-input"
              id="chat-input"
              type="text"
              placeholder="Type a message..."
              onkeydown="if(event.key==='Enter') sendMessage()"
            />
            <button class="send-btn" onclick="sendMessage()">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 9L16 2L10 16L8.5 10L2 9Z" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
      </div>
 
    </main>
 
    <nav class="botnav">
      <a href="../home/home.html" class="nav-btn">
        <svg viewBox="0 0 22 22" fill="none"><rect x="2" y="2" width="8" height="8" rx="2" fill="currentColor" opacity=".9"/><rect x="12" y="2" width="8" height="8" rx="2" fill="currentColor" opacity=".4"/><rect x="2" y="12" width="8" height="8" rx="2" fill="currentColor" opacity=".4"/><rect x="12" y="12" width="8" height="8" rx="2" fill="currentColor" opacity=".4"/></svg>
        Home <div class="nav-dot"></div>
      </a>
      <a href="../search/search.html" class="nav-btn">
        <svg viewBox="0 0 22 22" fill="none"><circle cx="9.5" cy="9.5" r="5.5" stroke="currentColor" stroke-width="1.5"/><line x1="13.5" y1="13.5" x2="19" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Search <div class="nav-dot"></div>
      </a>
      <a href="../saved/saved.html" class="nav-btn">
        <svg viewBox="0 0 22 22" fill="none"><path d="M11 17L4 10.5C4 7.5 6 5 8.5 5C9.8 5 11 6 11 6C11 6 12.2 5 13.5 5C16 5 18 7.5 18 10.5L11 17Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        Saved <div class="nav-dot"></div>
      </a>
      <a href="../messaging/messaging.html" class="nav-btn active">
        <svg viewBox="0 0 22 22" fill="none"><path d="M3 4h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H7l-4 3V5a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        Messages <div class="nav-dot"></div>
      </a>
    </nav>
 
  </div>
 
  <script src="../data.js"></script>
  <script src="messaging.js"></script>
</body>
</html>
